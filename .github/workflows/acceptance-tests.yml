          fi

  api-tests-ocm:
    name: apiOcm
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: "8.4"
          extensions: curl, xml, mbstring, zip, ldap, gd
          tools: composer
      - name: Download oCIS binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ocis-binary
          path: ocis/bin
      - name: Mark oCIS binary executable
        run: chmod +x ocis/bin/ocis
      - name: Download ociswrapper binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ociswrapper-binary
          path: /usr/local/bin
      - name: Mark ociswrapper binary executable
        run: chmod +x /usr/local/bin/ociswrapper
      - name: Rewrite providers.json for localhost
        run: |
          sed \
            -e 's|ocis-server:9200|localhost:9200|g' \
            -e 's|federation-ocis-server:10200|localhost:10200|g' \
            tests/config/ci/providers.json > /tmp/ocm-providers.json
          echo "providers.json rewritten to /tmp/ocm-providers.json"
      - name: Setup oCIS
        uses: mklos-kw/ocis-github-actions/ocis-setup@main
        with:
          ocis-binary: ocis/bin/ocis
          demo-users: "true"
          email: "true"
          extra-server-env: >-
            {"OCIS_ADD_RUN_SERVICES":"ocm,notifications","OCIS_ENABLE_OCM":"true",
            "OCM_OCM_INVITE_MANAGER_INSECURE":"true","OCM_OCM_SHARE_PROVIDER_INSECURE":"true",
            "OCM_OCM_STORAGE_PROVIDER_INSECURE":"true",
            "OCM_OCM_PROVIDER_AUTHORIZER_PROVIDERS_FILE":"/tmp/ocm-providers.json",
            "NOTIFICATIONS_SMTP_HOST":"localhost","NOTIFICATIONS_SMTP_PORT":"1025",
            "NOTIFICATIONS_SMTP_INSECURE":"true",
            "NOTIFICATIONS_SMTP_SENDER":"ownCloud <noreply@example.com>",
            "NOTIFICATIONS_DEBUG_ADDR":"0.0.0.0:9174"}
      - name: Start federation oCIS
        run: |
          FED_CONFIG_DIR="${HOME}/.ocis-federation/config"
          FED_DATA_DIR="${HOME}/.ocis-federation"
          mkdir -p "$FED_CONFIG_DIR"

          # Build federation env from .env-federation (source of port/addr truth)
          FED_ENV=()
          while IFS= read -r line; do
            line="${line#export }"
            line="${line#\!}"
            [[ -z "$line" || "$line" == \#* ]] && continue
            FED_ENV+=("$line")
          done < tests/config/local/.env-federation

          # CI overrides
          FED_ENV+=("OCIS_URL=https://localhost:10200")
          FED_ENV+=("OCIS_BASE_DATA_PATH=${FED_DATA_DIR}")
          FED_ENV+=("OCIS_CONFIG_DIR=${FED_CONFIG_DIR}")
          FED_ENV+=("OCIS_RUNTIME_PORT=10250")
          FED_ENV+=("MICRO_REGISTRY_ADDRESS=127.0.0.1:10233")
          FED_ENV+=("NATS_NATS_PORT=10233")
          FED_ENV+=("OCIS_EXCLUDE_RUN_SERVICES=idp")
          FED_ENV+=("STORAGE_USERS_DRIVER=ocis")
          FED_ENV+=("PROXY_ENABLE_BASIC_AUTH=true")
          FED_ENV+=("IDM_CREATE_DEMO_USERS=true")
          FED_ENV+=("IDM_ADMIN_PASSWORD=admin")
          FED_ENV+=("OCIS_EVENTS_ENABLE_TLS=false")
          FED_ENV+=("OCIS_JWT_SECRET=some-ocis-jwt-secret")
          FED_ENV+=("EVENTHISTORY_STORE=memory")
          FED_ENV+=("OCIS_ADD_RUN_SERVICES=ocm,notifications")
          FED_ENV+=("OCIS_ENABLE_OCM=true")
          FED_ENV+=("OCM_OCM_INVITE_MANAGER_INSECURE=true")
          FED_ENV+=("OCM_OCM_SHARE_PROVIDER_INSECURE=true")
          FED_ENV+=("OCM_OCM_STORAGE_PROVIDER_INSECURE=true")
          FED_ENV+=("OCM_OCM_PROVIDER_AUTHORIZER_PROVIDERS_FILE=/tmp/ocm-providers.json")
          FED_ENV+=("NOTIFICATIONS_SMTP_HOST=localhost")
          FED_ENV+=("NOTIFICATIONS_SMTP_PORT=1025")
          FED_ENV+=("NOTIFICATIONS_SMTP_INSECURE=true")
          FED_ENV+=("NOTIFICATIONS_SMTP_SENDER=ownCloud <noreply@example.com>")

          env "${FED_ENV[@]}" ocis/bin/ocis init --insecure true --config-path "$FED_CONFIG_DIR"
          cp tests/config/ci/app-registry.yaml "$FED_CONFIG_DIR/app-registry.yaml"

          env "${FED_ENV[@]}" ocis/bin/ocis server > /tmp/ocis-federation.log 2>&1 &
          echo $! > /tmp/ocis-federation.pid
          echo "federation oCIS started (PID $(cat /tmp/ocis-federation.pid))"

          echo "Waiting for federation oCIS at https://localhost:10200..."
          timeout 300 bash -c '
            until curl -sk -uadmin:admin https://localhost:10200/graph/v1.0/users/admin \
                  -w "%{http_code}" -o /dev/null 2>/dev/null | grep -q "200"; do
              sleep 2
            done
          ' || (echo "=== federation oCIS failed ===" && cat /tmp/ocis-federation.log | tail -50 && exit 1)
          echo "federation ocis ready."
      - name: Merge expected failures files
        run: |
          cat tests/acceptance/expected-failures-localAPI-on-OCIS-storage.md \
              tests/acceptance/expected-failures-without-remotephp.md \
              > /tmp/expected-failures.md
      - name: Test apiOcm
        uses: mklos-kw/ocis-github-actions/ocis-test@main
        with:
          suite: apiOcm
          expected-failures-file: /tmp/expected-failures.md
        env:
          TEST_SERVER_FED_URL: https://localhost:10200
      - name: Stop oCIS
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/ocis-wrapper.pid ]]; then
            kill "$(cat /tmp/ocis-wrapper.pid)" 2>/dev/null || true
            rm -f /tmp/ocis-wrapper.pid /tmp/ocis-server.log
          fi
          if [[ -f /tmp/ocis-federation.pid ]]; then
            kill "$(cat /tmp/ocis-federation.pid)" 2>/dev/null || true
            rm -f /tmp/ocis-federation.pid /tmp/ocis-federation.log
          fi

  api-tests-wopi:
    name: apiCollaboration
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: "8.4"
          extensions: curl, xml, mbstring, zip, ldap, gd
          tools: composer
      - name: Download oCIS binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ocis-binary
          path: ocis/bin
      - name: Mark oCIS binary executable
        run: chmod +x ocis/bin/ocis
      - name: Download ociswrapper binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ociswrapper-binary
          path: /usr/local/bin
      - name: Mark ociswrapper binary executable
        run: chmod +x /usr/local/bin/ociswrapper
      - name: Start fakeoffice
        run: |
          docker run -d --name fakeoffice --network host \
            -v "$(pwd):/ocis:ro" \
            python:3-alpine \
            python3 /ocis/tests/config/ci/fakeoffice-server.py
      - name: Start collabora
        run: |
          docker run -d --name collabora --network host \
            -e DONT_GEN_SSL_CERT=set \
            -e "extra_params=--o:ssl.enable=true --o:ssl.termination=true --o:welcome.enable=false --o:net.frame_ancestors=https://localhost:9200" \
            --entrypoint /bin/sh \
            collabora/code:24.04.5.1.1 \
            -c "set -e; coolconfig generate-proof-key; bash /start-collabora-online.sh"
      - name: Start onlyoffice
        run: |
          sudo systemctl stop postgresql || true
          docker run -d --name onlyoffice --network host \
            -e WOPI_ENABLED=true \
            -e USE_UNAUTHORIZED_STORAGE=true \
            -v "$(pwd)/tests/config/ci/only-office.json:/tmp/only-office.json:ro" \
            -v "$(pwd)/tests/config/ci/onlyoffice-entrypoint.sh:/entrypoint.sh:ro" \
            --entrypoint /bin/sh \
            onlyoffice/documentserver:9.0.0 \
            /entrypoint.sh
      - name: Setup oCIS
        uses: mklos-kw/ocis-github-actions/ocis-setup@main
        with:
          ocis-binary: ocis/bin/ocis
          demo-users: "true"
          extra-server-env: '{"GATEWAY_GRPC_ADDR":"0.0.0.0:9142"}'
      - name: Wait for WOPI app discovery endpoints
        run: |
          echo "Waiting for fakeoffice /hosting/discovery..."
          timeout 300 bash -c 'until curl -sf http://localhost:8080/hosting/discovery; do sleep 2; done'
          echo "Waiting for collabora /hosting/discovery..."
          timeout 300 bash -c 'until curl -sfk https://localhost:9980/hosting/discovery; do sleep 2; done'
          echo "Waiting for onlyoffice /hosting/discovery..."
          timeout 300 bash -c 'until curl -sfk https://localhost:443/hosting/discovery; do sleep 2; done'
          echo "All WOPI apps ready."
      - name: Start collaboration services
        run: |
          CONFIG_DIR="${HOME}/.ocis/config"
          OCIS_BIN="$(pwd)/ocis/bin/ocis"

          declare -A PORTS_COLLAB=(
            [collabora_grpc]=9301 [collabora_http]=9300 [collabora_debug]=9304
            [onlyoffice_grpc]=9311 [onlyoffice_http]=9310 [onlyoffice_debug]=9314
            [fakeoffice_grpc]=9321 [fakeoffice_http]=9320 [fakeoffice_debug]=9324
          )

          start_collab() {
            local name=$1 app_name=$2 product=$3 addr=$4 grpc=$5 http=$6 debug=$7
            env \
              OCIS_URL="https://localhost:9200" \
              OCIS_CONFIG_DIR="$CONFIG_DIR" \
              MICRO_REGISTRY=nats-js-kv \
              MICRO_REGISTRY_ADDRESS="localhost:9233" \
              COLLABORATION_LOG_LEVEL=debug \
              COLLABORATION_GRPC_ADDR="0.0.0.0:${grpc}" \
              COLLABORATION_HTTP_ADDR="0.0.0.0:${http}" \
              COLLABORATION_DEBUG_ADDR="0.0.0.0:${debug}" \
              COLLABORATION_APP_PROOF_DISABLE=true \
              COLLABORATION_APP_INSECURE=true \
              COLLABORATION_CS3API_DATAGATEWAY_INSECURE=true \
              OCIS_JWT_SECRET=some-ocis-jwt-secret \
              COLLABORATION_WOPI_SECRET=some-wopi-secret \
              COLLABORATION_APP_NAME="$app_name" \
              COLLABORATION_APP_PRODUCT="$product" \
              COLLABORATION_APP_ADDR="$addr" \
              COLLABORATION_WOPI_SRC="http://localhost:${http}" \
              "$OCIS_BIN" collaboration server > "/tmp/collab-${name}.log" 2>&1 &
            echo $! > "/tmp/collab-${name}.pid"
            echo "collaboration-${name} started (PID $!)"
          }

          start_collab collabora Collabora Collabora \
            "https://localhost:9980" \
            ${PORTS_COLLAB[collabora_grpc]} ${PORTS_COLLAB[collabora_http]} ${PORTS_COLLAB[collabora_debug]}
          start_collab onlyoffice OnlyOffice OnlyOffice \
            "https://localhost:443" \
            ${PORTS_COLLAB[onlyoffice_grpc]} ${PORTS_COLLAB[onlyoffice_http]} ${PORTS_COLLAB[onlyoffice_debug]}
          start_collab fakeoffice FakeOffice Microsoft \
            "http://localhost:8080" \
            ${PORTS_COLLAB[fakeoffice_grpc]} ${PORTS_COLLAB[fakeoffice_http]} ${PORTS_COLLAB[fakeoffice_debug]}

          # Wait for all three healthz endpoints
          for name in collabora onlyoffice fakeoffice; do
            key="${name}_debug"
            port="${PORTS_COLLAB[$key]}"
            echo "Waiting for collaboration-${name} healthz on :${port}..."
            timeout 300 bash -c "until curl -sf http://localhost:${port}/healthz; do sleep 2; done" \
              || (echo "=== collab-${name} log ===" && cat /tmp/collab-${name}.log | tail -30 && exit 1)
          done
          echo "All collaboration services ready."
      - name: Merge expected failures files
        run: |
          cat tests/acceptance/expected-failures-localAPI-on-OCIS-storage.md \
              tests/acceptance/expected-failures-without-remotephp.md \
              > /tmp/expected-failures.md
      - name: Test apiCollaboration
        uses: mklos-kw/ocis-github-actions/ocis-test@main
        with:
          suite: apiCollaboration
          expected-failures-file: /tmp/expected-failures.md
        env:
          COLLABORATION_SERVICE_URL: http://localhost:9320
      - name: Stop oCIS and collaboration services
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/ocis-wrapper.pid ]]; then
            kill "$(cat /tmp/ocis-wrapper.pid)" 2>/dev/null || true
          fi
          for name in collabora onlyoffice fakeoffice; do
            if [[ -f "/tmp/collab-${name}.pid" ]]; then
              kill "$(cat /tmp/collab-${name}.pid)" 2>/dev/null || true
            fi
          done

  cli-tests:
    needs: [build-and-test]
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - cliCommands,apiServiceAvailability   # grouped: both need ClamAV + email services
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: "8.4"
          extensions: curl, xml, mbstring, zip, ldap, gd
          tools: composer
      - name: Download oCIS binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ocis-binary
          path: ocis/bin
      - name: Mark oCIS binary executable
        run: chmod +x ocis/bin/ocis
      - name: Download ociswrapper binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ociswrapper-binary
          path: /usr/local/bin
      - name: Mark ociswrapper binary executable
        run: chmod +x /usr/local/bin/ociswrapper
      - name: Start ClamAV
        run: |
          docker run -d --name clamav --network host owncloudci/clamavd
          echo "Waiting for ClamAV on :3310..."
          timeout 300 bash -c '
            while true; do
              python3 -c "import socket,sys; s=socket.create_connection((\"localhost\",3310),2); s.close()" 2>/dev/null && break
              sleep 2
            done
          '
          echo "clamav ready."
      - name: Setup oCIS
        uses: mklos-kw/ocis-github-actions/ocis-setup@main
        with:
          ocis-binary: ocis/bin/ocis
          demo-users: "true"
          email: "true"
          extra-server-env: '{"OCIS_ADD_RUN_SERVICES":"antivirus,notifications","ANTIVIRUS_SCANNER_TYPE":"clamav","ANTIVIRUS_CLAMAV_SOCKET":"tcp://localhost:3310","ANTIVIRUS_DEBUG_ADDR":"0.0.0.0:9277"}'
      - name: Merge expected failures files
        run: |
          cat tests/acceptance/expected-failures-localAPI-on-OCIS-storage.md \
              tests/acceptance/expected-failures-without-remotephp.md \
              > /tmp/expected-failures.md
      - name: Test ${{ matrix.suite }}
        uses: mklos-kw/ocis-github-actions/ocis-test@main
        with:
          suite: ${{ matrix.suite }}
          expected-failures-file: /tmp/expected-failures.md
      - name: Stop oCIS
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/ocis-wrapper.pid ]]; then
            kill "$(cat /tmp/ocis-wrapper.pid)" 2>/dev/null || true
            rm -f /tmp/ocis-wrapper.pid /tmp/ocis-server.log
          fi


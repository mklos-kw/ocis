  all-acceptance-tests:
    # Not yet gating (run but don't block merge): api-tests-email, api-tests-tika,
    # api-tests-auth-app, core-api-tests, e2e-tests
    needs: [unit-tests, api-tests-plain, api-tests-antivirus, api-tests-ocm, api-tests-wopi, cli-tests, litmus, cs3api, wopi-builtin, wopi-cs3]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
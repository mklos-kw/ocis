  e2e-tests:
    name: e2e-${{ matrix.suite }}
    needs: [build-and-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: part-1
            args: "--total-parts 4 --xsuites search,app-provider,ocm,keycloak --run-part 1"
          - suite: part-2
            args: "--total-parts 4 --xsuites search,app-provider,ocm,keycloak --run-part 2"
          - suite: part-3
            args: "--total-parts 4 --xsuites search,app-provider,ocm,keycloak --run-part 3"
          - suite: part-4
            args: "--total-parts 4 --xsuites search,app-provider,ocm,keycloak --run-part 4"
          - suite: search
            args: "--suites search"
            tika: true
          - suite: keycloak
            args: "--suites journeys,keycloak"
            keycloak: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Generate code
        run: |
          pnpm config set store-dir ./.pnpm-store
          make ci-node-generate
        env:
          CHROMEDRIVER_SKIP_DOWNLOAD: "true"
      - name: Download oCIS binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ocis-binary
          path: ocis/bin
      - name: Download ociswrapper binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ociswrapper-binary
          path: /usr/local/bin
      - name: Mark binaries executable
        run: |
          chmod +x ocis/bin/ocis
          chmod +x /usr/local/bin/ociswrapper

      - name: Cache Playwright Chromium
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('ci.env') }}

      # --- Tika (search suite only) ---
      - name: Start Tika
        if: matrix.tika == true
        run: |
          docker run -d --name tika --network host apache/tika:3.2.2.0-full
          timeout 120 bash -c 'until curl -sf http://localhost:9998; do sleep 2; done'
          echo "tika ready."

      - name: Setup Keycloak
        if: matrix.keycloak == true
        uses: mklos-kw/ocis-github-actions/ocis-keycloak-setup@main

      - name: Clone web repo
        run: |
          WEB_BRANCH=$(grep '^WEB_BRANCH=' ci.env | cut -d= -f2- | tr -d '[:space:]')
          WEB_COMMITID=$(grep '^WEB_COMMITID=' ci.env | cut -d= -f2- | tr -d '[:space:]' || true)
          WEB_BRANCH="${WEB_BRANCH:-master}"
          git clone -b "$WEB_BRANCH" --single-branch --no-tags \
            https://github.com/owncloud/web.git webTestRunner
          if [[ -n "$WEB_COMMITID" ]]; then
            git -C webTestRunner checkout "$WEB_COMMITID"
          fi

      - name: Install web dependencies and Playwright
        run: |
          pnpm config set store-dir ./.pnpm-store
          pnpm install
          pnpm exec playwright install --with-deps chromium
        working-directory: webTestRunner

      - name: Patch web UI config
        run: |
          mkdir -p "${HOME}/.ocis/config"
          sed 's|https://ocis-server:9200|https://127.0.0.1:9200|g' \
            tests/config/ci/ocis-config.json \
            > "${HOME}/.ocis/config/web-ui-config.json"

      - name: Setup oCIS
        uses: mklos-kw/ocis-github-actions/ocis-setup@main
        with:
          ocis-binary: ocis/bin/ocis
          demo-users: "true"
          tika: ${{ matrix.tika == true && 'true' || 'false' }}
          keycloak: ${{ matrix.keycloak == true && 'true' || 'false' }}
          extra-server-env: >-
            {"OCIS_TRANSLATION_PATH":"${{ github.workspace }}/tests/config/translations",
            "WEB_UI_CONFIG_FILE":"${{ env.HOME }}/.ocis/config/web-ui-config.json",
            "THUMBNAILS_TXT_FONTMAP_FILE":"${{ github.workspace }}/tests/config/ci/fontsMap.json",
            "OCIS_PASSWORD_POLICY_BANNED_PASSWORDS_LIST":"${{ github.workspace }}/tests/config/ci/banned-password-list.txt",
            "GRAPH_AVAILABLE_ROLES":"b1e2218d-eef8-4d4c-b82d-0f1a1b48f3b5,a8d5fe5e-96e3-418d-825b-534dbdf22b99,fb6c3e19-e378-47e5-b277-9732f9de6e21,58c63c02-1d89-4572-916a-870abc5a1b7d,2d00ce52-1fc2-4dbc-8b95-a73b73395f5a,1c996275-f1c9-4e71-abdf-a42f6495e960,312c0871-5ef7-4b3a-85b6-0e4074c64049,aa97fe03-7980-45ac-9e50-b325749fd7e6,63e64e19-8d43-42ec-a738-2b6af2610efa",
            "FRONTEND_CONFIGURABLE_NOTIFICATIONS":"true",
            "ACTIVITYLOG_DEBUG_ADDR":"0.0.0.0:9197",
            "APP_PROVIDER_DEBUG_ADDR":"0.0.0.0:9165",
            "APP_REGISTRY_DEBUG_ADDR":"0.0.0.0:9243",
            "AUTH_BASIC_DEBUG_ADDR":"0.0.0.0:9147",
            "AUTH_MACHINE_DEBUG_ADDR":"0.0.0.0:9167",
            "AUTH_SERVICE_DEBUG_ADDR":"0.0.0.0:9198",
            "CLIENTLOG_DEBUG_ADDR":"0.0.0.0:9260",
            "EVENTHISTORY_DEBUG_ADDR":"0.0.0.0:9270",
            "FRONTEND_DEBUG_ADDR":"0.0.0.0:9141",
            "GATEWAY_DEBUG_ADDR":"0.0.0.0:9143",
            "GRAPH_DEBUG_ADDR":"0.0.0.0:9124",
            "GROUPS_DEBUG_ADDR":"0.0.0.0:9161",
            "IDM_DEBUG_ADDR":"0.0.0.0:9239",
            "IDP_DEBUG_ADDR":"0.0.0.0:9134",
            "INVITATIONS_DEBUG_ADDR":"0.0.0.0:9269",
            "NATS_DEBUG_ADDR":"0.0.0.0:9234",
            "OCDAV_DEBUG_ADDR":"0.0.0.0:9163",
            "OCM_DEBUG_ADDR":"0.0.0.0:9281",
            "OCS_DEBUG_ADDR":"0.0.0.0:9114",
            "POSTPROCESSING_DEBUG_ADDR":"0.0.0.0:9255",
            "PROXY_DEBUG_ADDR":"0.0.0.0:9205",
            "SEARCH_DEBUG_ADDR":"0.0.0.0:9224",
            "SETTINGS_DEBUG_ADDR":"0.0.0.0:9194",
            "SHARING_DEBUG_ADDR":"0.0.0.0:9151",
            "SSE_DEBUG_ADDR":"0.0.0.0:9139",
            "STORAGE_PUBLICLINK_DEBUG_ADDR":"0.0.0.0:9179",
            "STORAGE_SHARES_DEBUG_ADDR":"0.0.0.0:9156",
            "STORAGE_SYSTEM_DEBUG_ADDR":"0.0.0.0:9217",
            "STORAGE_USERS_DEBUG_ADDR":"0.0.0.0:9159",
            "THUMBNAILS_DEBUG_ADDR":"0.0.0.0:9189",
            "USERLOG_DEBUG_ADDR":"0.0.0.0:9214",
            "USERS_DEBUG_ADDR":"0.0.0.0:9145",
            "WEB_DEBUG_ADDR":"0.0.0.0:9104",
            "WEBDAV_DEBUG_ADDR":"0.0.0.0:9119",
            "WEBFINGER_DEBUG_ADDR":"0.0.0.0:9279"}

      - name: Trust oCIS self-signed cert
        run: |
          CERT="${HOME}/.ocis/proxy/server.crt"
          if [[ -f "$CERT" ]]; then
            sudo cp "$CERT" /usr/local/share/ca-certificates/ocis.crt
            sudo update-ca-certificates
          fi

      - name: Set cert path env
        run: echo "OCIS_CERT=${HOME}/.ocis/proxy/server.crt" >> "$GITHUB_ENV"

      - name: Run e2e-${{ matrix.suite }}
        run: bash run-e2e.sh ${{ matrix.args }}
        working-directory: webTestRunner/tests/e2e
        env:
          BASE_URL_OCIS: https://127.0.0.1:9200
          HEADLESS: "true"
          RETRY: "3"
          SKIP_A11Y_TESTS: "true"
          REPORT_TRACING: "true"
          NODE_EXTRA_CA_CERTS: ${{ env.OCIS_CERT }}
          BROWSER: chromium
          KEYCLOAK: ${{ matrix.keycloak == true && 'true' || 'false' }}
          KEYCLOAK_HOST: localhost:8443

      - name: Stop oCIS
        if: always()
        run: |
          if [[ -f /tmp/ocis-wrapper.pid ]]; then
            kill "$(cat /tmp/ocis-wrapper.pid)" 2>/dev/null || true
          fi

  litmus:
    name: litmus
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download oCIS binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ocis-binary
          path: ocis/bin
      - name: Mark oCIS binary executable
        run: chmod +x ocis/bin/ocis
      - name: Start oCIS
        uses: mklos-kw/ocis-github-actions/ocis-start-direct@main
        id: ocis
        with:
          ocis-binary: ocis/bin/ocis
          demo-users: "true"
      - name: Setup for litmus
        run: |
          OCIS_URL="https://127.0.0.1:9200"
          LITMUS_BASE="https://${{ steps.ocis.outputs.bridge-ip }}:9200"

          # Get personal space ID
          SPACE_ID=$(curl -sk -uadmin:admin "${OCIS_URL}/graph/v1.0/me/drives" | python3 -c "import json,sys; drives=json.load(sys.stdin); [print([p for p in d.get('root',{}).get('webDavUrl','').split('/') if p][-1]) for d in drives.get('value',[]) if d.get('driveType')=='personal']")
          echo "SPACE_ID=${SPACE_ID}" >> "$GITHUB_ENV"
          echo "LITMUS_BASE=${LITMUS_BASE}" >> "$GITHUB_ENV"
          echo "Space ID: ${SPACE_ID}"

          # Create test folder as einstein
          curl -sk -ueinstein:relativity -X MKCOL \
            "${OCIS_URL}/remote.php/webdav/new_folder" > /dev/null

          # Share einstein → admin
          SHARE_RESP=$(curl -sk -ueinstein:relativity \
            "${OCIS_URL}/ocs/v2.php/apps/files_sharing/api/v1/shares" \
            -d "path=/new_folder&shareType=0&permissions=15&name=new_folder&shareWith=admin")
          SHARE_ID=$(echo "$SHARE_RESP" | python3 -c "import re,sys; m=re.search(r'<id>(.+?)</id>', sys.stdin.read()); print(m.group(1) if m else '')")
          if [[ -n "$SHARE_ID" ]]; then
            curl -X POST -sk -uadmin:admin \
              "${OCIS_URL}/ocs/v2.php/apps/files_sharing/api/v1/shares/pending/${SHARE_ID}" \
              > /dev/null
          fi

          # Public share
          curl -sk -ueinstein:relativity \
            "${OCIS_URL}/ocs/v2.php/apps/files_sharing/api/v1/shares" \
            -d "path=/new_folder&shareType=3&permissions=15&name=new_folder" > /dev/null

      - name: Run litmus tests
        run: |
          LITMUS_IMAGE="owncloudci/litmus:latest"
          BRIDGE_IP="${OCIS_BRIDGE_IP}"
          BASE="https://${BRIDGE_IP}:9200"
          SPACE_ID="${SPACE_ID}"
          FAILED=()

          run_litmus() {
            local name=$1 endpoint=$2
            echo "Testing [${name}]: ${endpoint}"
            docker run --rm \
              -e "LITMUS_URL=${endpoint}" \
              -e LITMUS_USERNAME=admin \
              -e LITMUS_PASSWORD=admin \
              -e "TESTS=basic copymove props http" \
              "$LITMUS_IMAGE" || FAILED+=("$name")
          }

          run_litmus "old-endpoint"    "${BASE}/remote.php/webdav"
          run_litmus "new-endpoint"    "${BASE}/remote.php/dav/files/admin"
          run_litmus "new-shared"      "${BASE}/remote.php/dav/files/admin/Shares/new_folder/"
          run_litmus "old-shared"      "${BASE}/remote.php/webdav/Shares/new_folder/"
          run_litmus "spaces-endpoint" "${BASE}/remote.php/dav/spaces/${SPACE_ID}"

          if [[ ${#FAILED[@]} -gt 0 ]]; then
            echo "Failed: ${FAILED[*]}"
            exit 1
          fi
          echo "All litmus tests passed."

      - name: Stop oCIS
        if: always()
        run: |
          if [[ -f /tmp/ocis-direct.pid ]]; then
            kill "$(cat /tmp/ocis-direct.pid)" 2>/dev/null || true
          fi

  cs3api:
    name: cs3api
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download oCIS binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ocis-binary
          path: ocis/bin
      - name: Mark oCIS binary executable
        run: chmod +x ocis/bin/ocis
      - name: Start oCIS
        uses: mklos-kw/ocis-github-actions/ocis-start-direct@main
        id: ocis
        with:
          ocis-binary: ocis/bin/ocis
          demo-users: "true"
          extra-server-env: >-
            {"GATEWAY_GRPC_ADDR":"0.0.0.0:9142",
            "OCIS_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD":"false"}
      - name: Run cs3api validator
        run: |
          docker run --rm \
            --entrypoint /usr/bin/cs3api-validator \
            owncloud/cs3api-validator:0.2.1 \
            /var/lib/cs3api-validator \
            --endpoint="${OCIS_BRIDGE_IP}:9142"
      - name: Stop oCIS
        if: always()
        run: |
          if [[ -f /tmp/ocis-direct.pid ]]; then
            kill "$(cat /tmp/ocis-direct.pid)" 2>/dev/null || true
          fi

  wopi-builtin:
    name: wopi-builtin
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download oCIS binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ocis-binary
          path: ocis/bin
      - name: Mark oCIS binary executable
        run: chmod +x ocis/bin/ocis
      - name: Setup WOPI (builtin)
        id: wopi
        uses: mklos-kw/ocis-github-actions/ocis-wopi-setup@main
        with:
          ocis-binary: ocis/bin/ocis
          server-type: builtin
      - name: Prepare test file and run WOPI validator
        run: |
          BRIDGE_IP="${OCIS_BRIDGE_IP}"
          OCIS_URL="https://127.0.0.1:9200"
          VALIDATOR_IMAGE="owncloudci/wopi-validator"

          # PUT test file
          curl -sk -uadmin:admin -X PUT \
            --fail --retry-connrefused --retry 7 --retry-all-errors \
            "${OCIS_URL}/remote.php/webdav/test.wopitest" \
            -D /tmp/wopi-headers.txt

          # Extract file ID
          FILE_ID=$(grep -i 'Oc-Fileid:' /tmp/wopi-headers.txt | sed 's/.*: *//' | tr -d '\r\n ')
          echo "FILE_ID=${FILE_ID}"

          # Open app
          OPEN=$(curl -sk -uadmin:admin -X POST --fail \
            --retry-connrefused --retry 7 --retry-all-errors \
            "${OCIS_URL}/app/open?app_name=FakeOffice&file_id=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote('${FILE_ID}', safe=''))")")
          echo "open: ${OPEN:0:400}"

          ACCESS_TOKEN=$(echo "$OPEN" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['form_parameters']['access_token'])")
          TTL=$(echo "$OPEN" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['form_parameters']['access_token_ttl'])")
          APP_URL=$(echo "$OPEN" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('app_url',''))")
          if echo "$APP_URL" | grep -q 'files%2F'; then
            FILE_ID_ENC=$(echo "$APP_URL" | sed 's/.*files%2F//')
          elif echo "$APP_URL" | grep -q 'files/'; then
            FILE_ID_ENC=$(echo "$APP_URL" | sed 's/.*files\///')
          else
            FILE_ID_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote('${FILE_ID}', safe=''))")
          fi
          WOPI_SRC="http://${BRIDGE_IP}:9300/wopi/files/${FILE_ID_ENC}"
          echo "WOPI_SRC=${WOPI_SRC}"

          FAILED=()
          SHARED_GROUPS=(BaseWopiViewing CheckFileInfoSchema EditFlows Locks AccessTokens GetLock ExtendedLockLength FileVersion Features)
          BUILTIN_GROUPS=(PutRelativeFile RenameFileIfCreateChildFileIsNotSupported)

          for group in "${SHARED_GROUPS[@]}"; do
            echo "Running testgroup [${group}]"
            docker run --rm --workdir /app \
              --entrypoint /app/Microsoft.Office.WopiValidator \
              "$VALIDATOR_IMAGE" \
              -t "$ACCESS_TOKEN" -w "$WOPI_SRC" -l "$TTL" --testgroup "$group" \
              || FAILED+=("$group")
          done

          for group in "${BUILTIN_GROUPS[@]}"; do
            echo "Running testgroup [${group}] (secure)"
            docker run --rm --workdir /app \
              --entrypoint /app/Microsoft.Office.WopiValidator \
              "$VALIDATOR_IMAGE" \
              -s -t "$ACCESS_TOKEN" -w "$WOPI_SRC" -l "$TTL" --testgroup "$group" \
              || FAILED+=("$group")
          done

          if [[ ${#FAILED[@]} -gt 0 ]]; then
            echo "Failed testgroups: ${FAILED[*]}"
            exit 1
          fi
          echo "All WOPI validator tests passed."
      - name: Stop oCIS and collaboration service
        if: always()
        run: |
          if [[ -f /tmp/ocis-direct.pid ]]; then kill "$(cat /tmp/ocis-direct.pid)" 2>/dev/null || true; fi
          if [[ -f /tmp/collab-wopi.pid ]]; then kill "$(cat /tmp/collab-wopi.pid)" 2>/dev/null || true; fi
          docker rm -f wopi-fakeoffice 2>/dev/null || true

